name: TradeForge checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Replay historical Phase A writers in the manifest upgrade regressions.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements.lock
      - name: Backend tests
        run: ./.venv/Scripts/python.exe -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run e2e
      - name: Upload TF-D01 browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TF-D01-browser-evidence
          path: frontend/test-results/drawing-placement-*/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload TF-D02 browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TF-D02-browser-evidence
          path: frontend/test-results/drawing-edit-*/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TF-I01 browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TF-I01-browser-evidence
          path: |
            frontend/test-results/indicator-engine-*/**
            frontend/test-results/drawing-edit-a-canonical-*/drawing-with-ema.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload TF-U01 workspace evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TF-U01-workspace-evidence
          path: frontend/test-results/chart-workspace-*/**
          if-no-files-found: ignore
          retention-days: 14
